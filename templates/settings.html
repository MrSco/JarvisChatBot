<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Settings</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script>
        var openai_model = "{{ config['openai_model'] }}";
        var groq_model = "{{ config['groq_model'] }}";
        var google_model = "{{ config['google_model'] }}";
        var ai_service = "{{ config.get('ai_service', 'openai') }}";
        var radio_stream_url = "{{ config['radio_stream_url'] }}";
        var kids_radio_stream_url = "{{ config['kids_radio_stream_url'] }}";
        var elevenlabs_key = "{{ config['elevenlabs_key'] }}";
        var tts_engine = "{{ config['tts_engine'] }}";
        var piper_voice = "{{ config.get('piper_voice', 'en_US-lessac-medium') }}";
        var piper_models_dir = "{{ config.get('piper_models_dir', './piper_models') }}";
        var image_storage = "{{ 'freeimage' if config['image_storage'] else 'local' }}";
        var freeimage_key = "{{ config['freeimage_key'] }}";
        var max_threshold = "{{ config['max_threshold'] }}";
        var led_brightness = "{{ config['led_brightness'] }}";
        var vad_threshold = "{{ config['vad_threshold'] }}";
        var available_models = JSON.parse('{{ config.get("available_models", {"openai": [], "groq": [], "google": []}) | tojson | safe }}');
    </script>
    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
</head>
<body>
    <div id="sideNav" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a id="homeLink" href="/">Home</a>
        <a id="historyLink" href="/history">History</a>
        <a id="settingsLink" href="/settings">Settings</a>
    </div>
    <div id="settingsContainer">
        <h1 id="header">
            <span class="hamburger" onclick="openNav()">&#9776;</span>
            <a href="/" class="home-link" title="Back to Home">&#127968;</a>
            <span>Settings</span>
        </h1>
        <form id="settingsForm">
            <div>
                <label for="ai_service">AI Service:</label>
                <select id="ai_service" name="ai_service">
                    <option value="openai">OpenAI</option>
                    <option value="groq">Groq</option>
                    <option value="google">Google Gemini</option>
                </select>
            </div>
            <div>
                <label for="openai_key">OpenAI Key:</label>
                <input id="openai_key" name="openai_key" type="password" value="{{ config['openai_key'] }}">
            </div>
            <div>
                <label for="openai_modelSelect">OpenAI Model:</label>
                <select id="openai_modelSelect" name="openai_model">
                    <option value="chatgpt-4o-latest">GPT-4o Latest</option>
                    <option value="gpt-4o">GPT-4o</option>
                    <option value="gpt-4o-mini">GPT-4o Mini</option>
                    <option value="gpt-3.5-turbo">GPT-3.5 Turbo</option>
                </select>
            </div>
            <div>
                <label for="groq_key">Groq Key:</label>
                <input id="groq_key" name="groq_key" type="password" value="{{ config['groq_key'] }}">
            </div>
            <div>
                <label for="groq_modelSelect">Groq Model:</label>
                <select id="groq_modelSelect" name="groq_model">
                    <option value="llama-3.3-70b-versatile">Llama 3.3 70b</option>
                    <option value="llama-3.2-90b-vision-preview">Llama 3.2 90b</option>
                    <option value="llama-3.1-70b-versatile">Llama 3.1 70b</option>
                    <option value="llama-3.1-8b-instant">Llama 3.1 8b</option>
                    <option value="mixtral-8x7b-32768">Mixtral 8x7b</option>
                </select>
            </div>
            <div>
                <label for="google_key">Google Key:</label>
                <input id="google_key" name="google_key" type="password" value="{{ config['google_key'] }}">
            </div>
            <div>
                <label for="google_modelSelect">Google Gemini Model:</label>
                <select id="google_modelSelect" name="google_model">
                    <option value="gemini-2.0-flash-exp">Gemini 2.0 Flash Experimental</option>
                    <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                    <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                </select>
            </div>
            <div>
                <label for="radio_stream_url">Radio Stream URL:</label>
                <input type="text" id="radio_stream_url" name="radio_stream_url" value="{{ config['radio_stream_url'] }}">
            </div>
            <div>
                <label for="kids_radio_stream_url">Kids Radio Stream URL:</label>
                <input type="text" id="kids_radio_stream_url" name="kids_radio_stream_url" value="{{ config['kids_radio_stream_url'] }}">
            </div>
            <div>
                <label for="picovoice_key">Picovoice Key:</label>
                <input id="picovoice_key" name="picovoice_key" type="password" value="{{ config['picovoice_key'] }}">
            </div>
            <div>
                <label for="tts_engine">TTS Engine:</label>
                <select id="tts_engine" name="tts_engine">
                    <option value="pyttsx3">System TTS (pyttsx3)</option>
                    <option value="gtts">Google TTS (gTTS)</option>
                    <option value="elevenlabs">ElevenLabs</option>
                    <option value="piper">Piper TTS</option>
                </select>
            </div>
            <div>
                <label for="elevenlabs_key">ElevenLabs Key:</label>
                <input id="elevenlabs_key" name="elevenlabs_key" type="password" value="{{ config['elevenlabs_key'] }}">
            </div>
            <div>
                <label for="image_storage">Image Storage:</label>
                <select id="image_storage" name="image_storage">
                    <option value="local">Local Storage</option>
                    <option value="freeimage">Free Image Host</option>
                </select>
            </div>
            <div>
                <label for="freeimage_key">FreeImage Key:</label>
                <input id="freeimage_key" name="freeimage_key" type="password" value="{{ config['freeimage_key'] }}">
            </div>
            <div class="vad_container">
                <label for="thresholdSlider">Voice Threshold: </label>
                <input type="range" id="thresholdSlider" name="vad_threshold" min="1" max="{{ config['max_threshold'] }}" value="{{ config['vad_threshold'] }}">
                <span id="thresholdValue">{{ config['vad_threshold'] }}</span>
            </div>
            <div>
                <label for="max_threshold">Max Threshold:</label>
                <input type="number" id="max_threshold" name="max_threshold" value="{{ config['max_threshold'] }}">
            </div>
            <div>
                <label for="led_brightness">LED Brightness:</label>
                <input type="number" id="led_brightness" name="led_brightness" value="{{ config['led_brightness'] }}">
            </div>
            <div>
                <label for="system_prompt">System Prompt:</label>
                <textarea id="system_prompt" name="system_prompt" disabled>{{ config['system_prompt'] }}</textarea>
            </div>
            <button type="submit">Save Settings</button>
        </form>
    </div>
    <div class="loading-overlay">
        <div class="loading-spinner"></div>
    </div>
</body>
</html>
